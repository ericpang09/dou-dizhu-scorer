name: Build iOS (需要 macOS runner + Apple 開發者帳號)

on:
  workflow_dispatch:  # 只能手動觸發（需要 signing secrets）

jobs:
  build:
    runs-on: macos-14  # GitHub 提供 macOS runner（收費：$0.08/min）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios || true

      - name: Copy web assets
        run: npx cap copy ios

      # 注意：要 build 出可以上架嘅 IPA，需要 Apple 開發者證書 + Provisioning Profile
      # 喺 GitHub repo Settings → Secrets 加入：
      #   APPLE_CERTIFICATE_BASE64 (p12 base64)
      #   APPLE_CERTIFICATE_PASSWORD
      #   APPLE_PROVISIONING_PROFILE_BASE64
      # 然後用 fastlane / xcode-archive 幫你簽署
      - name: Open in Xcode（手動步驟）
        run: |
          echo "iOS build 需要 signing secrets。請參考 README iOS 部分。"
          echo "Project 已準備好：ios/App/"
          ls ios/App/ 2>/dev/null || echo "iOS project 會喺 cap add ios 後生成"
