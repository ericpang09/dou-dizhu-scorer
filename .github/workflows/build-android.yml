name: Build Android APK & Signed AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy web assets to native
        run: npx cap copy android

      # ============================================================
      #  Release signing（用 GitHub Secrets 入面嘅 keystore）
      #  首次跑：如果冇 KEYSTORE_BASE64 secret，會自動生一個新 keystore
      #  並上傳為 artifact 俾你下載備份，之後手動加做 Secret
      # ============================================================
      - name: Decode or generate release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "=== 用現有 keystore（由 Secrets 解碼）==="
            echo "$KEYSTORE_BASE64" | base64 -d > signing/release.keystore
            echo "$KEYSTORE_PASSWORD" > signing/store.pass
            echo "$KEY_ALIAS" > signing/alias.name
            echo "$KEY_PASSWORD" > signing/key.pass
            echo "first_run=false" >> $GITHUB_OUTPUT
          else
            echo "=== 冇 keystore secret，自動生成新嘅 ==="
            # PKCS12 唔支援 store/key 唔同密碼，所以兩個用同一個
            KSTORE_PASS="dz$(openssl rand -hex 8)"
            KALIAS="doudizhu"
            keytool -genkeypair -v \
              -keystore signing/release.keystore \
              -alias "$KALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KSTORE_PASS" -keypass "$KSTORE_PASS" \
              -dname "CN=Eric Pang, OU=Dev, O=ZCode, L=HK, ST=HK, C=HK"
            echo "$KSTORE_PASS" > signing/store.pass
            echo "$KALIAS" > signing/alias.name
            echo "$KSTORE_PASS" > signing/key.pass
            echo "first_run=true" >> $GITHUB_OUTPUT
            echo "keystore_password=$KSTORE_PASS" >> $GITHUB_OUTPUT
            echo "key_alias=$KALIAS" >> $GITHUB_OUTPUT
            echo "key_password=$KSTORE_PASS" >> $GITHUB_OUTPUT
          fi
          ls -la signing/

      - name: Inject signing config into Gradle
        working-directory: android
        run: |
          cp ../signing/release.keystore app/release.keystore
          STORE_PASS=$(cat ../signing/store.pass)
          ALIAS=$(cat ../signing/alias.name)
          KEY_PASS=$(cat ../signing/key.pass)
          # 驗證 keystore 真係讀到
          keytool -list -keystore app/release.keystore -storepass "$STORE_PASS" -alias "$ALIAS" | head -5
          # 寫 properties file（Gradle 讀返嚟）
          cat > app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          EOF
          # 喺 build.gradle 頂部讀 properties，設定 signingConfig
          cat > app/signing.gradle <<'GRADLE'
          def props = new Properties()
          props.load(new FileInputStream(rootProject.file('app/keystore.properties')))
          android {
              signingConfigs {
                  release {
                      storeFile file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "apply from: 'signing.gradle'" >> app/build.gradle
          echo "✓ Signing config 已注入"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dou-dizhu-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dou-dizhu-signed-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload keystore backup (首次生成 — 務必下載保存)
        if: steps.keystore.outputs.first_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KESTORE-BACKUP-DONT-LOSE
          path: |
            signing/release.keystore
            signing/store.pass
            signing/alias.name
            signing/key.pass
          retention-days: 90

      - name: Print signing info (首次生成 — 記低呢啲密碼)
        if: steps.keystore.outputs.first_run == 'true'
        run: |
          echo "============================================"
          echo "🔑 首次 keystore 生成 — 記低以下資訊！"
          echo "============================================"
          echo "KEYSTORE_PASSWORD = ${{ steps.keystore.outputs.keystore_password }}"
          echo "KEY_ALIAS = ${{ steps.keystore.outputs.key_alias }}"
          echo "KEY_PASSWORD = ${{ steps.keystore.outputs.key_password }}"
          echo ""
          echo "⚠️ 下一步（保存後再做）："
          echo "1. Download KESTORE-BACKUP-DONT-LOSE artifact，妥善保存"
          echo "2. 喺 repo Settings → Secrets → Actions 加入 4 個 secret（令以後 build 用返同一個 keystore）："
          echo "   - KEYSTORE_BASE64 (跑：base64 -w 0 signing/release.keystore)"
          echo "   - KEYSTORE_PASSWORD"
          echo "   - KEY_ALIAS"
          echo "   - KEY_PASSWORD"
